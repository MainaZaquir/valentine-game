<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Game</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    
    <div class="container">
        <h1>Will you be my valentine? 💖</h1>
        <div id="game">
            <p>Tap the floating hearts 3 times to unlock the question!</p>
            <div class="hearts">
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
            </div>
        </div>
        <div id="question" class="hidden">
            <button id="yes"> Yes 💖</button>
            <button id="no">No 😈</button>
        </div>

        <h2 id="reponse" class="hidden"> Yay! I knew you'd say YES! 🎉</h2>
        <p id="try-again" class="hidden">Try Again! 😜</p>
        <canvas id="cofetti"></canvas>

    </div>


    <style>
        /* CSS Styles */
            body {
                text-align: center;
                font-family: Arial, sans-serif;
                background-color: #ffe4e1;
                margin: 0;
                padding: 0;
            }
            .container {
                margin-top: 50px;
                padding: 20px;
            }
            h1 {
                color: #ff4081;
            }
            .hearts {
                display: flex;
                justify-content: center;
                gap: 10px;
                font-size: 2rem;
                cursor: pointer;
            }
            .heart {
                animation: float 2s infinite ease-in-out;
            }
            @keyframes float {
                0% { transform: translateY(0px); }
                50% { transform: translateY(-10px); }
                100% { transform: translateY(0px); }
            }
            .hidden {
                display: none;
            }
            button {
                font-size: 1.5rem;
                padding: 10px 20px;
                margin: 10px;
                cursor: pointer;
                border-radius: 8px;
                border: none;
            }
            #yes {
                background-color: #ff4081;
                color: white;
                transition: transform 0.3s ease;
            }
            #no {
                background-color: #f44336;
                color: white;
                position: relative;
            }
            #try-again {
                color: #ff4081;
                font-size: 1.5rem;
                margin-top: 20px;
            }
            @media (max-width: 600px) {
                .hearts {
                    font-size: 1.5rem;
                }
                button {
                    font-size: 1.2rem;
                    padding: 8px 16px;
                }
            }
    </style>

</body>
</html>
