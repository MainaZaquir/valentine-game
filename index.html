<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Game</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    
    <div class="container">
        <h1>Will you be my valentine? 💖</h1>
        <div id="game">
            <p>Tap the floating hearts 3 times to unlock the question!</p>
            <div class="hearts">
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
            </div>
        </div>
        <div id="question" class="hidden">
            <button id="yes"> Yes 💖</button>
            <button id="no">No 😈</button>
        </div>

        <h2 id="response" class="hidden"> Yay! I knew you'd say YES! 🎉</h2>
        <p id="try-again" class="hidden">Try Again! 😜</p>
        <canvas id="confetti"></canvas>

    </div>


    <style>
        /* CSS Styles */
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #ffe4e1;
        }
        
        .container {
            margin-top: 50px;
        }
        
        h1 {
            color: #ff4081;
        }
        
        .hearts {
            display: flex;
            justify-content: center;
            gap: 10px;
            font-size: 2rem;
            cursor: pointer;
        }
        
        .heart {
            animation: float 2s infinite ease-in-out;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        .hidden {
            display: none;
        }
        
        button {
            font-size: 1.5rem;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            border-radius: 8px;
            border: none;
        }
        
        #yes {
            background-color: #ff4081;
            color: white;
        }
        
        #no {
            background-color: #f44336;
            color: white;
            position: relative;
        }
        
        .gift-box {
            width: 100px;
            height: 100px;
            background: #ff4081;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        
        .gift-box::before {
            content: "🎁";
            font-size: 3rem;
            position: absolute;
            top: -10px;
        }
        
        .gift-box.open {
            animation: openGift 1s forwards;
        }
        
        @keyframes openGift {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -55%) scale(1.1); }
            100% { transform: translate(-50%, -60%) scale(1.2); }
        }
        
        .gift-message {
            display: none;
            position: absolute;
            top: 110px;
            font-size: 1.2rem;
            color: #ff4081;
            font-weight: bold;
        }
        
        .gift-box.open .gift-message {
            display: block;
        }
        
    </style>

    <script>
        // JavaScript Code
        let heartClicks = 0;
        let noClicks = 0;
        const hearts = document.querySelectorAll('.heart');
        const game = document.getElementById('game');
        const question = document.getElementById('question');
        const response = document.getElementById('response');
        const noButton = document.getElementById('no');
        const yesButton = document.getElementById('yes');
        const secretMessage = document.createElement("h3");
        const giftBox = document.createElement("div");
        const messageInside = document.createElement("p");

        hearts.forEach(heart => {
            heart.addEventListener('click', () => {
                heart.style.opacity = '0';
                heartClicks++;
                if (heartClicks === 3) {
                    game.classList.add('hidden');
                    question.classList.remove('hidden');
                }
            });
        });

        noButton.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            noButton.style.position = 'absolute';
            noButton.style.left = `${x}px`;
            noButton.style.top = `${y}px`;
        });

        noButton.addEventListener('click', () => {
            noClicks++;
            if (noClicks >= 5) {
                secretMessage.innerText = "There’s no escaping love! 💘";
                secretMessage.style.color = "#ff4081";
                secretMessage.style.marginTop = "20px";
                document.body.appendChild(secretMessage);
                noButton.style.display = "none";
            }
        });

        yesButton.addEventListener('click', () => {
            response.classList.remove('hidden');
            question.classList.add('hidden');
            startConfetti();
            showGiftBox();
        });

        function showGiftBox() {
            giftBox.classList.add("gift-box");
            messageInside.innerText = "You're my favorite person! 💖";
            messageInside.classList.add("gift-message");

            setTimeout(() => {
                giftBox.classList.add("open"); 
                giftBox.appendChild(messageInside);
            }, 2000); 

            document.body.appendChild(giftBox);
        }

        function startConfetti() {
            const confettiCanvas = document.getElementById('confetti');
            const ctx = confettiCanvas.getContext('2d');
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
            const confetti = [];

            for (let i = 0; i < 100; i++) {
                confetti.push({
                    x: Math.random() * confettiCanvas.width,
                    y: Math.random() * confettiCanvas.height,
                    r: Math.random() * 6 + 2,
                    d: Math.random() * 5 + 1
                });
            }

            function drawConfetti() {
                ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                confetti.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `hsl(${Math.random() * 360}, 100%, 50%)`;
                    ctx.fill();
                });
                moveConfetti();
            }

            function moveConfetti() {
                confetti.forEach(p => {
                    p.y += p.d;
                    if (p.y > confettiCanvas.height) {
                        p.y = 0;
                    }
                });
            }

            function loop() {
                drawConfetti();
                requestAnimationFrame(loop);
            }

            loop();
        }


    </script>

</body>
</html>
