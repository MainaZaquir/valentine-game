<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Valentine's Game Enhanced</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Lato&display=swap" rel="stylesheet">
</head>
<body>

    <div id="nameModal" class="modal">
        <div class="modal-content">
            <h2>Welcome!</h2>
            <p>Please enter your name:</p>
            <input type="text" id="userNameInput" placeholder="Your Name">
            <button id="startGame">Start Game</button>
        </div>
    </div>

    <button id="musicControl">Pause Music 🔇</button>

    <p id="countdown"></p>

    <div class="container hidden">
        <h1 id="mainQuestion">Will you be my Valentine?</h1>
        <div id="game" class="hidden">
            <p>Tap the floating hearts 3 times to unlock the question!</p>
            <div class="hearts">
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
            </div>
        </div>
        <div id="question" class="hidden">
            <button id="yes">Yes 💖</button>
            <button id="no">No 😈</button>
        </div>
        <h2 id="response" class="hidden"></h2>
        <p id="hidden-message" class="hidden"></p>
    </div>
    <canvas id="confetti"></canvas>
    <audio id="yesSound" src="yes-sound.mp3"></audio>
    <audio id="bgMusic" src="/Assets/music/bg-music.mp3" loop></audio>

    <div id="surprise" class="hidden">
        <img src="surprise.gif" alt="Surprise Animation">
    </div>

    <div id="hidden-heart" class="hidden-heart">💖</div>

    <div id="petals-container"></div>

    <p class="love-message"></p>

    <footer>
        <p>Made with 💖 by Maina Zaquir</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1"></script>
    <script src="script.js"></script>
</body>
</html>
